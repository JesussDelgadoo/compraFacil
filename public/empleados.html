<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Empleados | compraFacil</title>
    <link rel="stylesheet" href="/css/usuarios.css">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div>
                <h2>Módulo Empleados</h2>
                <p class="subtitle">Directorio de empleados de la empresa</p>
            </div>
            <div class="topbar-actions">
                <a class="btn" href="/dashboard.html">Volver</a>
                <a class="btn btn-primary" href="/empleados-form.html">+ Nuevo Empleado</a>
                <button id="logoutBtn" class="btn btn-danger" type="button">Cerrar Sesión</button>
            </div>
        </div>
        <section class="card">
            <div class="card-body">
                <div class="toolbar">
                    <input id="search" class="input" type="text" placeholder="Buscar por nombre o número..."/>
                    <button id="refreshBtn" class="btn">Actualizar</button>
                </div>
                <p id="status" class="status">Cargando...</p>
                <div class="table-wrap">
                    <table class="table" id="empleadosTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Núm. Empleado</th>
                                <th>Nombre (Usuario)</th>
                                <th>Puesto</th>
                                <th>Fecha Contratación</th>
                                <th style="width:180px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
    <script src="/js/empleados.js"></script>
</body>
</html>
