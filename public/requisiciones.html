<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Requisiciones | compraFacil</title>
    <link rel="stylesheet" href="/css/usuarios.css">
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div>
                <h2>Módulo Requisiciones</h2>
                <p class="subtitle">Control de Solicitudes de Compra</p>
            </div>


            <div class="topbar-actions">
                <a class="btn" href="/dashboard.html">Volver</a>
                <button id="btnPDF" class="btn btn-primary" type="button">Exp PDF</button>
                <button id="btnExportExcel" class="btn btn-primary" type="button">Exp Excel</button>
                <a class="btn btn-primary" href="/requisiciones-form.html">+ Nueva Requisición</a>
                <button id="logoutBtn" class="btn btn-danger" type="button">Cerrar Sesión</button>
            </div>
        </div>
        <section class="card">
            <div class="card-body">
                <div class="toolbar">
                    <input id="search" class="input" type="text" placeholder="Buscar por folio, motivo o solicitante..."/>
                    <button id="refreshBtn" class="btn">Actualizar</button>
                </div>
                <p id="status" class="status">Cargando...</p>
                <div class="table-wrap">
                    <table class="table" id="requisicionesTable">
                        <thead>
                            <tr>
                                <th>Folio</th>
                                <th>Fecha</th>
                                <th>Motivo</th>
                                <th>Solicitante</th>
                                <th>Estado</th>
                                <th style="width:180px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
    <script src="/js/requisiciones.js"></script>
</body>
</html>
